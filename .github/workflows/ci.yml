name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: typecheck + test + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段指定（pnpm@10.34.5），
        # 不在此处重复指定以免版本冲突

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle (single-file)
        run: pnpm bundle

      - name: Smoke test (mock mode)
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          bash scripts/smoke-m0.sh

      - name: E2E demo (mock mode)
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          NSEAP_MOCK=1 NSEAP_STUDENT_ID=demo-student node --import tsx scripts/demo-e2e.ts
          NSEAP_MOCK=1 NSEAP_STUDENT_ID=teacher-demo NSEAP_ROLE=teacher node --import tsx scripts/demo-teacher.ts
